apiVersion: v1
kind: Secret
metadata:
  name: cryptocurrency-exchange-secrets
  namespace: crypto
type: Opaque
stringData:
  # Generate with: openssl rand -base64 48
  DJANGO_SECRET_KEY: "REPLACE_WITH_A_RANDOM_DJANGO_SECRET"
  DATABASE_USER: "exchange_app"
  DATABASE_PASSWORD: "REPLACE_WITH_A_STRONG_DATABASE_PASSWORD"
  POSTGRES_USER: "exchange_app"
  POSTGRES_PASSWORD: "REPLACE_WITH_A_STRONG_DATABASE_PASSWORD"
