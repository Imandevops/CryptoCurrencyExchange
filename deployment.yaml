apiVersion: batch/v1
kind: Job
metadata:
  name: cryptocurrency-exchange-migrate
  namespace: crypto
  annotations:
    purpose: database-migration
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cryptocurrency-exchange-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: crypto:v.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: cryptocurrency-exchange-config
            - secretRef:
                name: cryptocurrency-exchange-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptocurrency-exchange
  namespace: crypto
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cryptocurrency-exchange
      app.kubernetes.io/part-of: cryptocurrency-exchange
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cryptocurrency-exchange
        app.kubernetes.io/part-of: cryptocurrency-exchange
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cryptocurrency-exchange
          image: crypto:v.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cryptocurrency-exchange-config
            - secretRef:
                name: cryptocurrency-exchange-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: crypto-exchange
  namespace: crypto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cryptocurrency-exchange
    app.kubernetes.io/part-of: cryptocurrency-exchange
  ports:
    - name: http
      port: 8000
      targetPort: http
